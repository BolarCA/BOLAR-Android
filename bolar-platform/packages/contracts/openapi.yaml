paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency health
      tags:
        - health
      security: []
      x-bolar-auth: public
      x-bolar-permission: null
      x-bolar-idempotent: false
      parameters:
        - schema:
            type: string
            description: Declared purpose for sensitive data access.
          required: false
          name: X-Access-Purpose
          in: header
      responses:
        "200":
          description: Success response (X-Request-Id header set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Conflict or idempotency issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags:
        - auth
      security: []
      x-bolar-auth: public
      x-bolar-permission: null
      x-bolar-idempotent: false
      parameters:
        - schema:
            type: string
            description: Declared purpose for sensitive data access.
          required: false
          name: X-Access-Purpose
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Success response (X-Request-Id header set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Conflict or idempotency issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate refresh token and issue a new access token
      tags:
        - auth
      security: []
      x-bolar-auth: public
      x-bolar-permission: null
      x-bolar-idempotent: false
      parameters:
        - schema:
            type: string
            description: Declared purpose for sensitive data access.
          required: false
          name: X-Access-Purpose
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Success response (X-Request-Id header set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Conflict or idempotency issue
          content:
