paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency health
      tags:
        - health
      security: []
      x-bolar-auth: public
      x-bolar-permission: null
      x-bolar-idempotent: false
      parameters:
        - schema:
            type: string
            description: Declared purpose for sensitive data access.
          required: false
          name: X-Access-Purpose
          in: header
      responses:
        "200":
          description: Success response (X-Request-Id header set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Conflict or idempotency issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
