services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bolar
      POSTGRES_USER: bolar
      POSTGRES_PASSWORD: local_only
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolar -d bolar"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]
  # ---- Optional observability stack (Days 91-104): docker compose --profile observability up -d ----
  # Point the API at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 and open Jaeger at http://localhost:16686.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["observability"]
    command: ["--config=/etc/otel/collector.yaml"]
    volumes: ["./infra/observability/otel-collector.yaml:/etc/otel/collector.yaml:ro"]
    ports: ["4318:4318", "4317:4317"]
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]
volumes:
  pgdata: {}
  miniodata: {}
