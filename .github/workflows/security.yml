name: security
on:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
defaults:
  run:
    working-directory: bolar-platform
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: bolar-platform/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm', cache-dependency-path: bolar-platform/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high and above fail the build)
        run: pnpm audit --audit-level high
      - name: Secret pattern scan
        run: |
          set -e
          if git grep -nE "(sk_live_[0-9a-zA-Z]{8,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" -- . ':!**/*.md' ; then
            echo "Potential live secret committed"; exit 1; fi
