name: ci
on:
  pull_request:
  push:
    branches: [master, main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: bolar-platform
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: bolar, POSTGRES_USER: bolar, POSTGRES_PASSWORD: local_only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bolar" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: postgresql://bolar:local_only@localhost:5432/bolar?schema=public
      REDIS_URL: redis://localhost:6379
      QUEUE_DRIVER: memory
      AUTH_JWT_SECRET: ci_only_secret_ci_only_secret_ci_only_secret_000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      # `pnpm build` above produces the web build the e2e server runs from
      E2E_REUSE_WEB_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: bolar-platform/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 'lts/*', cache: 'pnpm', cache-dependency-path: bolar-platform/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env && sed -i "s#^DATABASE_URL=.*#DATABASE_URL=$DATABASE_URL#" .env
      - run: pnpm env:check
      - run: pnpm lint
      - run: pnpm prisma:validate
      - run: pnpm db:migrate
      - run: pnpm db:migrate:test
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm openapi:check
      - run: pnpm docs:lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:smoke
      - run: pnpm a11y:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: bolar-platform/tests/playwright-report, retention-days: 7 }
